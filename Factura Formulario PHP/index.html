<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura con Formulario PHP</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
</head>
<body class="container mt-5"> <!--Empezamos con la estructura del formulario-->
    <h1 class="mb-4" text-center>Factura Comercial</h1> <!--Hacemos uso de Bootstrap en nuestros titulos y tablas-->
    <form method="POST" action="factura.php">
        <h2>Datos Del Cliente</h2 >
        <div class="row mb-3">
            <div class="col-md-6"> <!--Colocamos lo principal: nombre, correo, fecha, comentario con sus respectivos id-->
                <label for = "nombree" class="form-label">Nombre Del Cliente</label>
                <input type = "text" name = "nombree" id = "nombree" class="form-control" required>
                <label for= "correoo" class="form-label">Correo Electrónico</label>
                <input type = "email" name="correoo" id="correoo" class="form-control" required>
            </div>
        </div>
        <div class = "row mb-3">
            <div>
                <label for="fechaa" class = "form-label">Fecha:</label>
                <input type="date" name = "fechaa" id = "fechaa"  class = "form-control" required>
            </div>
        </div>
        <div class = "mb-3">
            <label for = "comentarioss" class="form-label">Comentario:</label>
            <textarea name = "comentarioss"  id = "comentarioss" class = "form-control"></textarea>
        </div>

        <h2>Información de Productos</h2> <!--Hacemos uso de card via Bootstrap y sus col y row-->
        <div class="card mb-3"> <!--El codigo sera identico en sus tres productos para facilitar su vision y revision-->
            <div class = "card-body">
                <h5 class = "card-title">Producto 1</h5>
                <div class = "row">
                    <div class="col-md-4">
                        <label for="articulo1" class="form-label">Nombre del artículo:</label>
                        <input type = "text" name = "articulo1" id="articulo1" class= "form-control">
                    </div>
                    <div class= "col-md-2">
                        <label for= "precioart1"  class= "form-label">Precio:</label>
                        <input type= "number" name ="precioart1" id="precioart1" class="form-control" step="0.01" min="0">
                    </div>
                    <div class= "col-md-3">
                        <label for= "cantidadart1"  class= "form-label">Cantidad:</label>
                        <input type= "number" name ="cantidadart1" id="cantidadart1" class="form-control" min="1" >
                    </div>
                    <div class = "col-md-3">
                        <label for = "cat1" class= "form-label">Categoría:</label>
                        <select name= "cat1" id = "cat1" class="form-select">
                            <option value ="">Seleccione</option>
                            <option value= "Electronicos">Electrónicos</option>
                            <option value= "Ropa">Ropa</option>
                            <option value="Hogar">Hogar</option>
                            <option>Otro</option>
                        </select>
                    </div>
                </div><br>
                <div><!--Abajo colocamos un input de tipo checkbox parta el tema del IVA-->
                    <input type ="checkbox" name = "iva1" id= "iva1" class="form-check-input">
                    <label for="iva1" class= "form-check-label">Añadir IVA (15%)</label>
                </div>
            </div>

        </div>
        <div class="card mb-3"> <!--2-->
            <div class = "card-body">
                <h5 class = "card-title">Producto 2</h5> 
                <div class = "row">
                    <div class="col-md-4">
                        <label for="articulo2" class="form-label">Nombre del artículo:</label>
                        <input type = "text" name = "articulo2" id="articulo2" class= "form-control">
                    </div>
                    <div class= "col-md-2">
                        <label for= "precioart2"  class= "form-label">Precio:</label>
                        <input type= "number" name = "precioart2" id= "precioart2" class="form-control" step="0.01" min="0">
                    </div>
                    <div class= "col-md-3">
                        <label for= "cantidadart2"  class= "form-label">Cantidad:</label>
                        <input type= "number" name ="cantidadart2" id="cantidadart2" class="form-control" min="1">
                    </div>
                    <div class = "col-md-3">
                        <label for = "cat2" class= "form-label">Categoría:</label>
                        <select name= "cat2" id = "cat2" class="form-select">
                            <option value ="">Seleccione</option>
                            <option value= "Electronicos">Electrónicos</option>
                            <option value= "Ropa">Ropa</option>
                            <option value="Hogar">Hogar</option>
                            <option>Otro</option>
                        </select>
                    </div>
                </div><br>
                <div>
                    <input type ="checkbox" name = "iva2" id= "iva2" class="form-check-input">
                    <label for="iva2" class= "form-check-label">Añadir IVA (15%)</label>
                </div>
            </div>

        </div>
        <div class="card mb-3"><!--3-->
            <div class = "card-body">
                <h5 class = "card-title">Producto 3</h5>
                <div class = "row">
                    <div class="col-md-4">
                        <label for="articulo3" class="form-label">Nombre del artículo:</label>
                        <input type = "text" name = "articulo3" id="articulo3" class= "form-control">
                    </div>
                    <div class= "col-md-2">
                        <label for= "precioart3"  class= "form-label">Precio:</label>
                        <input type= "number" name ="precioart3" id="precioart3" class="form-control" step="0.01" min="0" >
                    </div>
                    <div class= "col-md-3">
                        <label for= "cantidadart3"  class= "form-label">Cantidad:</label>
                        <input type= "number" name  = "cantidadart3" id="cantidadart3" class ="form-control" min="1">
                    </div>
                    <div class = "col-md-3">
                        <label for = "cat3" class= "form-label">Categoría:</label>
                        <select name = "cat3" id =  "cat3" class = "form-select">
                            <option value ="">Seleccione</option>
                            <option value= "Electronicos">Electrónicos</option>
                            <option value = "Ropa">Ropa</option>
                            <option value = "Hogar">Hogar</option>
                            <option>Otro</option>
                        </select>
                    </div>
                </div><br>
                <div>
                    <input type ="checkbox" name = "iva3" id= "iva3" class="form-check-input">
                    <label for="iva3" class= "form-check-label">Añadir IVA (15%)</label>
                </div>
            </div>

        </div> <!--Abajo colocamos el boton para enviar los datos-->
        <button type = "submit"  class="btn btn-primary">Hacer Factura</button>

    </form>        

    </div>
    
</body>
</html>
