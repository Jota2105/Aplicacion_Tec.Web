<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas con jQuery</title>
    <script src="JS/jquery.js"></script>
    <link rel="stylesheet" href="CSS/styles.css">
<body>
    <h1>Listado de Tareas</h1>
    <form id="formulario">
        <input type="text" id="tareaInput" placeholder="Escribe una nueva tarea">
        <button type="submit">Agregar</button>
    </form>
    <div id="mensaje">¡Tarea agregada!</div>
    <div id="listaTareas" title="De click a la tarea para marcarla como completada"></div>
    <button id="vaciarLista" title="Presione doble click">Vaciar Lista</button>

    <script src="JS/script.js"></script>
</body>
</html>
